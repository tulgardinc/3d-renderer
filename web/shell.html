<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Depth-sorted carousel</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0d12;
      }
      /* The canvas is the whole page. Its *backing store* size is still owned
         by SDL -- this only makes the element fill the viewport, which is what
         SDL's emscripten backend reads back when the window is resizable. */
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <script>
      var Module = {
        canvas: document.getElementById("canvas"),
        print: (...args) => console.log(...args),
        printErr: (...args) => console.error(...args),
      };
      // Keyboard input goes to the canvas, so it needs focus on load.
      Module.canvas.focus();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
